<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>🎄 聖誕歡樂大抽獎 🎄</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="admin.html" class="admin-link" target="_blank">⚙️ 設定名單</a>
    <audio id="bgm" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" type="audio/mpeg">
    </audio>

    <div id="snow-container"></div>

    <div id="cloud-container">
        </div>

    <div class="controls">
        <button id="drawBtn" class="btn">🎅 開始抽獎 🎅</button>
        <button id="musicBtn" class="btn" style="font-size:16px">🎵 音樂開關</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, get, child, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // TODO: 請在此處填入你的 Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyD0Y08KBDzL0lyfqedDR7CAAjITWkD5J-o",
            authDomain: "chrismas2025prizerolling.firebaseapp.com",
            databaseURL: "https://chrismas2025prizerolling-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chrismas2025prizerolling",
            storageBucket: "chrismas2025prizerolling.firebasestorage.app",
            messagingSenderId: "930100253668",
            appId: "1:930100253668:web:7839e115cadb93fc05adf1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const usersRef = ref(db, 'users');

        let users = [];
        let isDrawing = false;
        let animationInterval;
        
        // 1. 監聽 Firebase 資料庫變化 (即時同步)
        onValue(usersRef, (snapshot) => {
            const data = snapshot.val();
            const cloudContainer = document.getElementById('cloud-container');
            
            // 如果正在抽獎中，暫時不更新畫面以免打斷動畫
            if(isDrawing) return;

            cloudContainer.innerHTML = ''; // 清空
            users = [];

            if (data) {
                Object.keys(data).forEach(key => {
                    const user = data[key];
                    // 只有未中獎且在場的人才顯示
                    if (!user.winner) {
                        users.push({ id: key, name: user.name });
                        createNameTag(user.name);
                    }
                });
            }
        });

        // 建立漂浮名字標籤
        function createNameTag(name) {
            const tag = document.createElement('div');
            tag.className = 'name-tag';
            tag.innerText = name;
            
            // 隨機位置
            const x = Math.random() * 80 + 10; // 10% - 90% width
            const y = Math.random() * 80 + 10; // 10% - 90% height
            
            tag.style.left = x + '%';
            tag.style.top = y + '%';
            
            // 隨機漂浮動畫 (簡單 CSS transform)
            const duration = Math.random() * 3 + 2; // 2-5秒
            tag.style.transition = `top ${duration}s ease-in-out, left ${duration}s ease-in-out`;
            
            document.getElementById('cloud-container').appendChild(tag);
            animateTag(tag);
        }

        // 讓標籤持續隨機移動
        function animateTag(tag) {
            setInterval(() => {
                if(tag.classList.contains('winner')) return;
                const x = Math.random() * 80 + 10;
                const y = Math.random() * 80 + 10;
                tag.style.left = x + '%';
                tag.style.top = y + '%';
            }, 3000);
        }

        // 雪花特效
        function createSnow() {
            const snowContainer = document.getElementById('snow-container');
            for(let i=0; i<50; i++){
                const snow = document.createElement('div');
                snow.className = 'snowflake';
                snow.innerHTML = '❄';
                snow.style.left = Math.random() * 100 + 'vw';
                snow.style.animationDuration = Math.random() * 3 + 2 + 's';
                snow.style.opacity = Math.random();
                snowContainer.appendChild(snow);
            }
        }
        createSnow();

        // 抽獎邏輯
        const drawBtn = document.getElementById('drawBtn');
        drawBtn.addEventListener('click', () => {
            if (users.length === 0) {
                alert("名單中沒有人！");
                return;
            }
            if (isDrawing) return; // 防止重複點擊

            isDrawing = true;
            drawBtn.disabled = true;
            drawBtn.innerText = "抽獎中...";

            // 1. 動畫加速 (視覺效果)
            const tags = document.querySelectorAll('.name-tag');
            tags.forEach(tag => {
                tag.style.transition = "all 0.1s linear"; // 加快移動速度
            });

            // 快速閃爍循環
            let counter = 0;
            const shuffleInterval = setInterval(() => {
                tags.forEach(t => t.style.background = 'rgba(255,0,0,0.3)');
                const randomTag = tags[Math.floor(Math.random() * tags.length)];
                randomTag.style.background = 'gold';
                
                // 隨機移動位置
                randomTag.style.left = Math.random() * 80 + 10 + '%';
                randomTag.style.top = Math.random() * 80 + 10 + '%';
                
                counter++;
                if (counter > 30) { // 跑30次後停止
                    clearInterval(shuffleInterval);
                    finalizeWinner();
                }
            }, 100);
        });

        function finalizeWinner() {
            // 真正的隨機抽選
            const winnerIndex = Math.floor(Math.random() * users.length);
            const winnerData = users[winnerIndex];
            
            // 視覺呈現
            const tags = document.querySelectorAll('.name-tag');
            // 隱藏非中獎者 (或變淡)
            tags.forEach(tag => {
                if (tag.innerText === winnerData.name) {
                    tag.classList.add('winner');
                } else {
                    tag.style.opacity = '0.1';
                }
            });

            // 更新 Firebase (標記該人已中獎)
            // 延遲更新以確保動畫先跑完
            setTimeout(() => {
                alert(`恭喜 ${winnerData.name} 中獎！`);
                // 將該用戶標記為 winner: true，這樣下次就不會出現
                update(child(usersRef, winnerData.id), { winner: true });
                
                isDrawing = false;
                drawBtn.disabled = false;
                drawBtn.innerText = "🎅 開始抽獎 🎅";
                
                // 恢復顯示
                tags.forEach(tag => tag.style.opacity = '1');
            }, 2000);
        }

        // 音樂控制
        const audio = document.getElementById('bgm');
        document.getElementById('musicBtn').addEventListener('click', () => {
            if (audio.paused) audio.play();
            else audio.pause();
        });

    </script>
</body>
</html>
