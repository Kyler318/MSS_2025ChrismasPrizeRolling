<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>🎄 聖誕歡樂大抽獎 🎄</title>
    <link rel="stylesheet" href="style.css">
    <a href="admin.html" class="admin-link" target="_blank">⚙️ 設定名單</a>
</head>
<body>
    <div id="snow-container"></div>
    
    <div id="background-decorations">
        <img src="chrismas tree.png" class="deco-img deco-tree" alt="聖誕樹">
        <img src="Santa Claus.png" class="deco-img deco-santa" alt="聖誕老人">
        <img src="chrismas sock.png" class="deco-img deco-sock" alt="聖誕襪">
    </div>

    <div id="cloud-container"></div>

    <div id="history-panel">
        <div class="history-header">
            <button id="close-history-btn">✕</button>
            📜 獲獎榜單
        </div>
        <div class="history-content" id="history-list">
            <div style="text-align:center; color:#aaa; margin-top:20px;">暫無紀錄</div>
        </div>
    </div>

    <div class="controls">
        <span id="round-info" style="color: gold; font-size: 24px; margin-right: 20px; text-shadow: 0 2px 5px rgba(0,0,0,0.5);">
        🏆 第 1 輪
        </span>
        <button id="drawBtn" class="btn">🎅 開始抽獎 🎅</button>
        <button id="historyBtn" class="btn">📜 名單</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        // ✅ 新增 'push' 匯入
        import { getDatabase, ref, onValue, update, push } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD0Y08KBDzL0lyfqedDR7CAAjITWkD5J-o",
            authDomain: "chrismas2025prizerolling.firebaseapp.com",
            databaseURL: "https://chrismas2025prizerolling-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chrismas2025prizerolling",
            storageBucket: "chrismas2025prizerolling.firebasestorage.app",
            messagingSenderId: "930100253668",
            appId: "1:930100253668:web:7839e115cadb93fc05adf1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const usersRef = ref(db, 'users');
        const historyRef = ref(db, 'history'); // 新增：歷史紀錄節點

        let pool = [];
        let totalWinnerCount = 0;
        let isDrawing = false;

        // 1. 監聽使用者資料
        onValue(usersRef, (snapshot) => {
            const data = snapshot.val();
            let tempPool = [];
            let tempWinnerCount = 0;

            if (data) {
                Object.keys(data).forEach(key => {
                    const user = data[key];
                    if (user.winner) {
                        tempWinnerCount++;
                    } else {
                        tempPool.push({ id: key, name: user.name });
                    }
                });
            }

            pool = tempPool;
            totalWinnerCount = tempWinnerCount;
            updateRoundInfo();

            if (isDrawing) return;

            const cloudContainer = document.getElementById('cloud-container');
            cloudContainer.innerHTML = ''; 
            
            if (pool.length > 0) {
                pool.forEach(p => createNameTag(p.name));
            } else if (totalWinnerCount === 0) {
                 cloudContainer.innerHTML = '<h1 style="color:gold; text-shadow:2px 2px red;">請先至後台新增名單</h1>';
            }
        });

        // 2. 監聽歷史紀錄並更新面板
        onValue(historyRef, (snapshot) => {
            const data = snapshot.val();
            const listDiv = document.getElementById('history-list');
            listDiv.innerHTML = '';

            if (data) {
                // 將物件轉陣列並反轉 (最新的在上面)
                const historyArr = Object.values(data).reverse();
                
                historyArr.forEach(record => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    
                    // 格式化時間
                    const time = new Date(record.timestamp);
                    const timeStr = `${time.getHours()}:${String(time.getMinutes()).padStart(2, '0')}`;

                    item.innerHTML = `
                        <div class="history-round">
                            🏆 第 ${record.round} 輪 <span style="font-size:12px; float:right; opacity:0.7">${timeStr}</span>
                        </div>
                        <div class="history-names">
                            ${record.names.join('、')}
                        </div>
                    `;
                    listDiv.appendChild(item);
                });
            } else {
                listDiv.innerHTML = '<div style="text-align:center; color:#aaa; margin-top:20px;">尚未開始抽獎</div>';
            }
        });

        // 計算當前輪數的邏輯 (提取出來共用)
        function calculateRound(count) {
            if (count < 66) {
                return Math.floor(count / 3) + 1;
            } else {
                return 22 + (count - 66) + 1;
            }
        }

        function updateRoundInfo() {
            const currentRound = calculateRound(totalWinnerCount);
            document.getElementById('round-info').innerText = `🏆 第 ${currentRound} 輪`;
        }

        function createNameTag(name) {
            const tag = document.createElement('div');
            tag.className = 'name-tag';
            tag.innerText = name;
            
            const startX = Math.random() * 90; 
            const startY = Math.random() * 80;
            tag.style.transform = `translate3d(${startX}vw, ${startY}vh, 0)`;

            const duration = Math.random() * 3 + 4; 
            tag.style.transition = `transform ${duration}s ease-in-out`;
            
            document.getElementById('cloud-container').appendChild(tag);
            animateTag(tag);
        }

        function animateTag(tag) {
            const interval = setInterval(() => {
                if(tag.classList.contains('winner') || !document.body.contains(tag)) {
                    clearInterval(interval);
                    return;
                }
                const nextX = Math.random() * 90;
                const nextY = Math.random() * 80;
                tag.style.transform = `translate3d(${nextX}vw, ${nextY}vh, 0)`;
            }, 4000);
        }

        function createSnow() {
            const snowContainer = document.getElementById('snow-container');
            for(let i=0; i<30; i++){
                const snow = document.createElement('div');
                snow.className = 'snowflake';
                snow.innerHTML = '❄';
                snow.style.left = Math.random() * 100 + 'vw';
                snow.style.animationDuration = Math.random() * 3 + 2 + 's';
                snow.style.opacity = Math.random();
                snowContainer.appendChild(snow);
            }
        }
        createSnow();

        // 抽獎邏輯
        const drawBtn = document.getElementById('drawBtn');
        drawBtn.addEventListener('click', () => {
            if (pool.length === 0) return alert("名單為空或所有人都已中獎！");
            if (isDrawing) return;

            document.querySelectorAll('.winner').forEach(el => el.remove());
            document.querySelectorAll('.name-tag').forEach(el => el.style.opacity = '1');

            isDrawing = true;
            drawBtn.disabled = true;
            drawBtn.innerText = "抽獎中...";

            let batchSize = 1;
            if (totalWinnerCount < 66) {
                batchSize = 3;
            }
            if (pool.length < batchSize) batchSize = pool.length;

            const tags = document.querySelectorAll('.name-tag');
            
            let counter = 0;
            const shuffleInterval = setInterval(() => {
                tags.forEach(t => t.style.background = 'rgba(255,0,0,0.3)');
                for(let i=0; i<Math.min(batchSize + 2, tags.length); i++){
                    const randomTag = tags[Math.floor(Math.random() * tags.length)];
                    if(randomTag) randomTag.style.background = 'gold';
                }
                
                counter++;
                if (counter > 25) { 
                    clearInterval(shuffleInterval);
                    finalizeBatchWinners(batchSize);
                }
            }, 100);
        });

        function finalizeBatchWinners(count) {
            const winners = [];
            const tempPool = [...pool];

            for (let i = 0; i < count; i++) {
                if (tempPool.length === 0) break;
                const randomIndex = Math.floor(Math.random() * tempPool.length);
                winners.push(tempPool[randomIndex]);
                tempPool.splice(randomIndex, 1);
            }

            const container = document.getElementById('cloud-container');
            document.querySelectorAll('.name-tag').forEach(t => t.style.opacity = '0.1');

            const updates = {}; 
            const winnerNames = []; // 暫存這次的中獎名單

            winners.forEach((winner, index) => {
                updates[`/users/${winner.id}/winner`] = true;
                winnerNames.push(winner.name);

                const winTag = document.createElement('div');
                winTag.className = 'name-tag winner'; 
                if (count > 1) winTag.classList.add('multi'); 
                winTag.innerText = winner.name;
                
                let leftPos = 50;
                if (count === 3) {
                    if (index === 0) leftPos = 20;
                    if (index === 1) leftPos = 50;
                    if (index === 2) leftPos = 80;
                } else if (count === 2) {
                    leftPos = (index === 0) ? 35 : 65;
                }

                winTag.style.left = leftPos + '%';
                container.appendChild(winTag);
            });

            // 🔥 新增：寫入歷史紀錄
            // 計算這是第幾輪 (使用目前的獲獎人數計算)
            const currentRound = calculateRound(totalWinnerCount);
            
            // 將這筆紀錄推送到 Firebase
            push(historyRef, {
                round: currentRound,
                names: winnerNames,
                timestamp: Date.now()
            });

            setTimeout(() => {
                update(ref(db), updates);
                isDrawing = false;
                drawBtn.disabled = false;
                drawBtn.innerText = "🎅 開始抽獎 🎅";
                // 自動開啟歷史面板讓大家看一眼 (可選)
                // document.getElementById('history-panel').classList.add('open');
            }, 1000);
        }

        const audio = document.getElementById('bgm');
        // 歷史面板開關邏輯
        const historyPanel = document.getElementById('history-panel');
        document.getElementById('historyBtn').addEventListener('click', () => {
            historyPanel.classList.add('open');
        });
        document.getElementById('close-history-btn').addEventListener('click', () => {
            historyPanel.classList.remove('open');
        });
    </script>
</body>
</html>
