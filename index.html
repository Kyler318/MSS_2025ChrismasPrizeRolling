<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>🎄 聖誕歡樂大抽獎 🎄</title>
    <link rel="stylesheet" href="style.css">
    <a href="admin.html" class="admin-link" target="_blank">⚙️ 設定名單</a>
</head>
<body>
    <audio id="bgm" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" type="audio/mpeg">
    </audio>

    <div id="snow-container"></div>
    <div id="cloud-container"></div>

    <div class="controls">
        <span id="round-info" style="color: gold; font-size: 24px; margin-right: 20px; text-shadow: 0 2px 5px rgba(0,0,0,0.5);">
        🏆 第 1 輪
        </span>
        <button id="drawBtn" class="btn">🎅 開始抽獎 🎅</button>
        <button id="musicBtn" class="btn" style="font-size:16px">🎵 音樂開關</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue, child, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD0Y08KBDzL0lyfqedDR7CAAjITWkD5J-o",
            authDomain: "chrismas2025prizerolling.firebaseapp.com",
            // 修正：移除了結尾的斜線 '/'
            databaseURL: "https://chrismas2025prizerolling-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chrismas2025prizerolling",
            storageBucket: "chrismas2025prizerolling.firebasestorage.app",
            messagingSenderId: "930100253668",
            appId: "1:930100253668:web:7839e115cadb93fc05adf1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const usersRef = ref(db, 'users');

        let pool = [];
        let totalWinnerCount = 0;
        let isDrawing = false;

        // 監聽資料庫
        onValue(usersRef, (snapshot) => {
            if (isDrawing) return;

            const data = snapshot.val();
            const cloudContainer = document.getElementById('cloud-container');
            cloudContainer.innerHTML = ''; 
            
            pool = [];
            totalWinnerCount = 0;

            if (data) {
                Object.keys(data).forEach(key => {
                    const user = data[key];
                    if (user.winner) {
                        totalWinnerCount++;
                    } else {
                        pool.push({ id: key, name: user.name });
                        createNameTag(user.name); 
                    }
                });
            } else {
                // 如果沒有資料，顯示提示
                cloudContainer.innerHTML = '<h1 style="color:gold; text-shadow:2px 2px red;">請先至後台新增名單</h1>';
            }
        });

        function createNameTag(name) {
            const tag = document.createElement('div');
            tag.className = 'name-tag';
            tag.innerText = name;
            tag.style.left = Math.random() * 90 + '%';
            tag.style.top = Math.random() * 90 + '%';
            
            const duration = Math.random() * 3 + 2;
            tag.style.transition = `top ${duration}s ease-in-out, left ${duration}s ease-in-out`;
            
            document.getElementById('cloud-container').appendChild(tag);
            animateTag(tag);
        }

        function animateTag(tag) {
            const interval = setInterval(() => {
                if(tag.classList.contains('winner') || !document.body.contains(tag)) {
                    clearInterval(interval);
                    return;
                }
                tag.style.left = Math.random() * 90 + '%';
                tag.style.top = Math.random() * 90 + '%';
            }, 3000);
        }

        // 雪花特效
        function createSnow() {
            const snowContainer = document.getElementById('snow-container');
            for(let i=0; i<30; i++){
                const snow = document.createElement('div');
                snow.className = 'snowflake';
                snow.innerHTML = '❄';
                snow.style.left = Math.random() * 100 + 'vw';
                snow.style.animationDuration = Math.random() * 3 + 2 + 's';
                snow.style.opacity = Math.random();
                snowContainer.appendChild(snow);
            }
        }
        createSnow();

        // 抽獎按鈕邏輯
        const drawBtn = document.getElementById('drawBtn');
        drawBtn.addEventListener('click', () => {
            if (pool.length === 0) return alert("名單為空或所有人都已中獎！");
            if (isDrawing) return;

            document.querySelectorAll('.winner').forEach(el => el.remove());
            document.querySelectorAll('.name-tag').forEach(el => el.style.opacity = '1');

            isDrawing = true;
            drawBtn.disabled = true;
            drawBtn.innerText = "抽獎中...";

            // 規則：前66人中獎者 (22輪) 一次抽3個，之後一次抽1個
            let batchSize = 1;
            if (totalWinnerCount < 66) {
                batchSize = 3;
            }
            if (pool.length < batchSize) batchSize = pool.length;

            const tags = document.querySelectorAll('.name-tag');
            tags.forEach(tag => tag.style.transition = "all 0.1s linear");

            let counter = 0;
            const shuffleInterval = setInterval(() => {
                tags.forEach(t => t.style.background = 'rgba(255,0,0,0.3)');
                for(let i=0; i<Math.min(batchSize, tags.length); i++){
                    const randomTag = tags[Math.floor(Math.random() * tags.length)];
                    if(randomTag) randomTag.style.background = 'gold';
                }
                
                counter++;
                if (counter > 25) { 
                    clearInterval(shuffleInterval);
                    finalizeBatchWinners(batchSize);
                }
            }, 100);
        });

        function finalizeBatchWinners(count) {
            const winners = [];
            const tempPool = [...pool];

            for (let i = 0; i < count; i++) {
                if (tempPool.length === 0) break;
                const randomIndex = Math.floor(Math.random() * tempPool.length);
                winners.push(tempPool[randomIndex]);
                tempPool.splice(randomIndex, 1);
            }

            const container = document.getElementById('cloud-container');
            document.querySelectorAll('.name-tag').forEach(t => t.style.opacity = '0.1');

            const updates = {}; 
            winners.forEach((winner, index) => {
                updates[`/users/${winner.id}/winner`] = true;

                const winTag = document.createElement('div');
                winTag.className = 'name-tag winner';
                if (count > 1) winTag.classList.add('multi'); 
                winTag.innerText = winner.name;
                
                let leftPos = 50;
                if (count === 3) {
                    if (index === 0) leftPos = 20;
                    if (index === 1) leftPos = 50;
                    if (index === 2) leftPos = 80;
                } else if (count === 2) {
                    leftPos = (index === 0) ? 35 : 65;
                }

                winTag.style.left = leftPos + '%';
                winTag.style.top = '50%';
                container.appendChild(winTag);
            });

            const winnerNames = winners.map(w => w.name).join("、");

            setTimeout(() => {
                update(ref(db), updates);
                isDrawing = false;
                drawBtn.disabled = false;
                drawBtn.innerText = "🎅 開始抽獎 🎅";
            }, 1000);
        }

        const audio = document.getElementById('bgm');
        document.getElementById('musicBtn').addEventListener('click', () => {
            if (audio.paused) audio.play();
            else audio.pause();
        });
    </script>
</body>
</html>
